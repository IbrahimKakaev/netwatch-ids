name: Démo et badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publier la démo et les badges
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Hébergé hors du poste local, le dashboard passe de lui-même en mode démo.
      - name: Build
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
        working-directory: frontend

      # Les badges du README lisent ces résultats, publiés avec la démo.
      - name: Tests frontend avec couverture
        working-directory: frontend
        run: npm test -- --watch=false --coverage --coverage-reporters=json-summary | tee ../frontend-tests.log
      - name: Installer libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Tests backend avec couverture
        working-directory: backend
        run: |
          cargo llvm-cov --no-report | tee ../backend-tests.log
          cargo llvm-cov report --json --summary-only --output-path ../backend-coverage.json
      - name: Générer les badges
        run: node .github/scripts/badges.mjs frontend/dist/frontend/browser/badges
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser
      - id: deployment
        uses: actions/deploy-pages@v4
